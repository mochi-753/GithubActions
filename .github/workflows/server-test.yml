name: Server Test

on:
  workflow_call:

jobs:
  ServerTest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare EULA
        run: |
          mkdir -p runs/server
          echo "eula=true" > runs/server/eula.txt

      - name: Run Server
        run: |
          set -e
          
          echo "Starting server..."
          chmod u+x gradlew && ./gradlew runServer --no-daemon > server.log 2>&1 &
          SERVER_PID=$!
          
          MAX_WAIT=600
          ELAPSED=0
          
          while ps -p $SERVER_PID > /dev/null; do
            if grep -q "Done (" server.log; then
              echo "Server started successfully"
              kill $SERVER_PID
              exit 0
            fi
          
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Server did not finish startup in time"
              kill $SERVER_PID
              echo "============ Server Log ============"
              cat server.log
              exit 1
            fi
          done
          
          echo "Server process exited early"
          echo "============ Server Log ============"
          cat server.log
          exit 1